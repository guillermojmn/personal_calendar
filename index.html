<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Personal Calendar</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the theme before first paint to avoid a flash.
    (function () {
      var t = null;
      try { t = JSON.parse(localStorage.getItem('personal-calendar:theme')); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div id="loading" class="loading">Loading…</div>

  <div id="auth" class="auth" hidden>
    <form id="loginForm" class="auth-card" hidden>
      <div class="auth-logo">📅</div>
      <h1>Personal Calendar</h1>
      <p class="auth-sub">Sign in to continue</p>
      <label>Email
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <p id="loginMsg" class="auth-msg" hidden></p>
      <button class="btn primary" type="submit">Sign in</button>
      <button id="btnForgot" class="link-btn" type="button">Forgot your password?</button>
    </form>

    <form id="recoveryForm" class="auth-card" hidden>
      <div class="auth-logo">🔑</div>
      <h1>Set a new password</h1>
      <label>New password
        <input type="password" name="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label>Repeat password
        <input type="password" name="confirm" autocomplete="new-password" minlength="8" required>
      </label>
      <p id="recoveryMsg" class="auth-msg" hidden></p>
      <button class="btn primary" type="submit">Save password</button>
    </form>

    <div id="configError" class="auth-card" hidden>
      <div class="auth-logo">⚙️</div>
      <h1>Not configured</h1>
      <p class="auth-sub">The app can't reach its database. Check that <code>config.js</code> is present (see the README).</p>
    </div>
  </div>

  <div id="app" hidden>
  <header class="topbar">
    <div class="nav">
      <button id="btnPrev" class="icon-btn" title="Previous (←)" aria-label="Previous">‹</button>
      <button id="btnToday" class="btn" title="Go to today (T)">Today</button>
      <button id="btnNext" class="icon-btn" title="Next (→)" aria-label="Next">›</button>
      <h1 id="viewTitle"></h1>
    </div>
    <div class="actions">
      <div class="seg" role="group" aria-label="View">
        <button data-view="month" title="Month view (M)">Month</button>
        <button data-view="week" title="Week view (W)">Week</button>
        <button data-view="day" title="Day view (D)">Day</button>
      </div>
      <input id="search" type="search" placeholder="Search…" aria-label="Search">
      <button id="btnNew" class="btn primary" title="New (N)">+ New</button>
      <div class="menu-wrap">
        <button id="btnMenu" class="icon-btn" title="More options" aria-label="More options">⋯</button>
        <div id="menu" class="menu" hidden>
          <div id="menuUser" class="menu-user"></div>
          <button id="btnExport">Export backup</button>
          <button id="btnImport">Import backup</button>
          <button id="btnSignOut">Sign out</button>
        </div>
      </div>
      <button id="btnTheme" class="icon-btn theme-toggle" type="button" title="Switch light/dark" aria-label="Switch to dark theme">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.8v2.4M12 19.8v2.4M4.8 4.8l1.7 1.7M17.5 17.5l1.7 1.7M1.8 12h2.4M19.8 12h2.4M4.8 19.2l1.7-1.7M17.5 6.5l1.7-1.7"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z"/></svg>
      </button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
  </header>

  <main class="layout">
    <section class="calendar">
      <div id="view"></div>
      <div id="legend" class="legend"></div>
    </section>

    <aside class="side">
      <div class="panel">
        <div class="panel-head">
          <h2 id="dayTitle"></h2>
          <button id="btnAddDay" class="btn small">+ Add</button>
        </div>
        <ul id="dayList" class="list"></ul>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>To do <span id="todoCount" class="count-badge"></span></h2>
        </div>
        <div id="todoProgress" class="todo-progress" hidden>
          <div class="todo-progress-bar"><div id="todoProgressFill"></div></div>
          <span id="todoProgressText"></span>
        </div>
        <form id="todoForm" class="todo-form">
          <div class="todo-input">
            <input name="title" maxlength="160" autocomplete="off" placeholder="Something to remember…" aria-label="New to-do">
            <button class="todo-add" type="submit" title="Add" aria-label="Add to-do">+</button>
          </div>
          <div class="due-picker" role="group" aria-label="Due date (optional)">
            <button class="due-chip" type="button" data-due="today" aria-pressed="false">Today</button>
            <button class="due-chip" type="button" data-due="tomorrow" aria-pressed="false">Tomorrow</button>
            <label id="todoDateChip" class="due-chip">
              <span id="todoDateLabel">Pick date</span>
              <input name="due" type="date" aria-label="Pick a due date">
            </label>
            <button id="todoDateClear" class="due-clear" type="button" title="Remove date" aria-label="Remove date" hidden>×</button>
          </div>
        </form>
        <ul id="todoList" class="list"></ul>
        <details id="todoDone" class="todo-done" hidden>
          <summary><span id="todoDoneSummary"></span></summary>
          <ul id="todoDoneList" class="list"></ul>
          <button id="btnClearDone" class="link-btn" type="button">Clear all done</button>
        </details>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Daily routine <span id="habitCount" class="habit-count"></span></h2>
        </div>
        <div class="progress"><div id="habitBar"></div></div>
        <ul id="habitList" class="list"></ul>
        <form id="habitForm" class="habit-form">
          <input name="title" maxlength="80" autocomplete="off" placeholder="e.g. Drink 2 L of water" aria-label="New routine item">
          <button class="btn small" type="submit">Add</button>
        </form>
      </div>

      <div class="panel">
        <h2 id="upcomingTitle">Next 30 days</h2>
        <ul id="upcomingList" class="list"></ul>
      </div>
    </aside>
  </main>

  <button id="fab" class="fab" title="New" aria-label="New">+</button>
  </div>

  <dialog id="dlg">
    <form id="form">
      <h2 id="dlgTitle">New</h2>
      <label>Title
        <input name="title" required maxlength="120" autocomplete="off" placeholder="e.g. Boxing">
      </label>
      <div class="row">
        <label>Type <select name="type"></select></label>
        <label>Date <input type="date" name="date" required></label>
      </div>
      <label class="check"><input type="checkbox" name="allDay"> All day</label>
      <div class="row" id="timesRow">
        <label>From <input type="time" name="start"></label>
        <label>To <input type="time" name="end"></label>
      </div>
      <div class="row">
        <label>Repeat <select name="repeat"></select></label>
        <label>Location <input name="location" maxlength="120" autocomplete="off"></label>
      </div>
      <label>Notes <textarea name="notes" rows="3"></textarea></label>
      <p id="formError" class="form-error" hidden></p>
      <div class="dlg-actions">
        <button type="button" id="btnDelete" class="btn danger">Delete</button>
        <span class="spacer"></span>
        <button type="button" id="btnCancel" class="btn">Cancel</button>
        <button type="submit" class="btn primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toastText"></span>
    <button id="toastAction" type="button"></button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
          integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o"
          crossorigin="anonymous"></script>
  <!-- Generated at deploy time from repository secrets; see README. -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
